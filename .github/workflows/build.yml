name: Tests et compilation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  test:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk cisso-academy-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cisso-academy-android
          path: cisso-academy-android.apk

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Durcissement : --obfuscate renomme les symboles du code Dart (AOT) et
      # --split-debug-info sort les informations de débogage dans un dossier
      # NON embarqué dans l'exe. Le code compilé est déjà du natif machine ;
      # l'obfuscation complique nettement toute tentative de rétro-ingénierie.
      - run: flutter build windows --release --obfuscate --split-debug-info=build/symbols
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath cisso-academy-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: cisso-academy-windows
          path: cisso-academy-windows-x64.zip

  windows-portable:
    name: Windows portable durci (un seul .exe)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cisso-academy-windows
          path: dist
      - name: Décompresser le build Windows (durci)
        shell: pwsh
        run: Expand-Archive -Path dist/cisso-academy-windows-x64.zip -DestinationPath release
      - name: Installer Enigma Virtual Box (gratuit)
        shell: pwsh
        run: |
          # Paquet choco périmé (somme de contrôle) : téléchargement direct chez l'éditeur.
          $setup = "$env:RUNNER_TEMP\enigmavb_setup.exe"
          $dir = "$env:RUNNER_TEMP\evb"
          Invoke-WebRequest -Uri 'https://enigmaprotector.com/assets/files/enigmavb.exe' -OutFile $setup
          Write-Host "SHA-256 installeur : $((Get-FileHash $setup).Hash)"
          $p = Start-Process -Wait -PassThru -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$dir"
          Write-Host "Code de sortie installeur : $($p.ExitCode)"
          $console = Get-ChildItem -Path $dir,'C:\Program Files\Enigma Virtual Box','C:\Program Files (x86)\Enigma Virtual Box' -Recurse -Filter 'enigmavbconsole.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $console) { Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName; throw 'enigmavbconsole.exe introuvable' }
          Write-Host "Console : $($console.FullName)"
          "EVB_CONSOLE=$($console.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          exit 0
      - name: Emballer en un seul .exe (fichiers compressés)
        shell: pwsh
        run: ./ci/windows_portable.ps1 -ReleaseDir release -OutputExe cisso-academy-portable.exe -EvbConsole $env:EVB_CONSOLE
      - name: Vérifier que l'exe démarre seul (sans fichiers à côté)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force seul | Out-Null
          Copy-Item cisso-academy-portable.exe seul/
          $p = Start-Process -FilePath seul/cisso-academy-portable.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "L'exe s'est arrêté (code $($p.ExitCode))" }
          Write-Host "Toujours lancé après 20 s, mémoire $([math]::Round($p.WorkingSet64/1MB)) Mo"
          Stop-Process -Id $p.Id -Force
          Get-ChildItem seul
      - uses: actions/upload-artifact@v4
        with:
          name: cisso-academy-windows-portable
          path: cisso-academy-portable.exe

  release:
    name: Publication (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
